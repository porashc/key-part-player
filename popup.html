<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Key Part Player</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>🎧 Key Part Player</h1>
      </header>

      <form id="searchForm">
        <input id="searchInput" type="text" placeholder="Search a song…" autocomplete="off" />
        <button type="submit">Search</button>
      </form>

      <div id="searchResults" class="results"></div>

      <section class="now-playing" id="nowPlaying">
        <div class="np-empty">Nothing playing — add a song above.</div>
      </section>

      <section class="queue-section">
        <div class="queue-header">
          <h2>Queue</h2>
          <button id="clearQueueBtn" class="link-btn">Clear</button>
        </div>
        <div id="queueList" class="queue-list"></div>
      </section>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
